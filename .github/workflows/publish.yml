name: Publicar no Instagram

# Publica o próximo item de queue/posts.yaml e commita o estado.
#
# É o motor único: os workflows por formato (Reels, Stories, carrossel) chamam
# este aqui via workflow_call. Três cópias divergiriam na primeira correção que
# alguém esquecesse de replicar nas outras duas.

on:
  schedule:
    - cron: '0 13 * * *'   # 10h no horário de Brasília
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'escolher o item sem publicar'
        type: choice
        options: ['false', 'true']
        default: 'false'
      selection:
        description: 'weighted (sorteio) ou order (primeiro da fila)'
        type: choice
        options: ['weighted', 'order']
        default: 'weighted'
      media_type:
        description: 'formato (vazio = qualquer)'
        type: choice
        options: ['', 'REELS', 'STORIES', 'CAROUSEL', 'IMAGE']
        default: ''
      queue:
        description: 'arquivo de fila'
        type: choice
        options: ['queue/posts.yaml', 'queue/stories.yaml']
        default: 'queue/posts.yaml'
      max_por_dia:
        description: 'não publica se o dia já tiver este tanto (0 = sem limite)'
        type: string
        default: '0'
  workflow_call:
    inputs:
      dry_run:
        type: string
        default: 'false'
      selection:
        type: string
        default: 'weighted'
      media_type:
        type: string
        default: ''
      queue:
        type: string
        default: 'queue/posts.yaml'
      max_por_dia:
        type: string
        default: '0'

permissions:
  contents: write

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: pip install --quiet -r requirements.txt

      - name: Publicar
        id: publicar
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          IG_ALERT_WEBHOOK: ${{ secrets.IG_ALERT_WEBHOOK }}
          IG_DRY_RUN: ${{ inputs.dry_run || 'false' }}
          IG_SELECTION: ${{ inputs.selection || 'weighted' }}
        run: |
          set +e
          python -m poster.cli publish \
            --media-type "${{ inputs.media_type || '' }}" \
            --max-por-dia "${{ inputs.max_por_dia || '0' }}" \
            --queue "${{ inputs.queue || 'queue/posts.yaml' }}"
          codigo=$?
          echo "codigo=$codigo" >> "$GITHUB_OUTPUT"
          # 2 = fila sem item elegível: é aviso, não falha do job.
          if [ "$codigo" = "2" ]; then exit 0; fi
          exit $codigo

      - name: Commitar estado
        if: steps.publicar.outputs.codigo == '0'
        run: |
          # Estagia antes de comparar: `git diff` não enxerga arquivo novo.
          git add -- state/published.json
          if git diff --cached --quiet; then
            echo "nada mudou em state/published.json"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: registra publicação no Instagram'
          # Rebase e tentativas porque o coletor de métricas empurra no mesmo
          # branch de hora em hora. Sem isso, uma corrida normal rejeitaria o
          # push — e o item ficaria publicado no Instagram SEM constar em
          # state/published.json, ou seja, elegível para sair de novo amanhã.
          for tentativa in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((tentativa * 5))
          done
          echo "::error::publiquei mas não consegui gravar state/published.json"
          exit 1

      - name: Capturar o ponto zero da curva
        # O coletor de hora em hora entrega ~25% das ocorrências, então a
        # primeira leitura de um story pode chegar horas depois de ele ir ao
        # ar. Aqui não há agendador no caminho: o story acabou de nascer, e
        # esta captura dá o ponto de idade 0 que a curva de acumulação precisa
        # para dizer QUANDO as visualizações chegam, não só quantas foram.
        #
        # Não duplica nada: a curva é indexada por (story, idade em horas
        # arredondada) e a tabela por story, ficando com o maior valor lido.
        # Uma captura do coletor na mesma hora cai na mesma linha.
        if: steps.publicar.outputs.codigo == '0' && inputs.dry_run != 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          set +e
          python -m poster.cli story-metrics
          codigo=$?
          # Falha de métrica não derruba a publicação, que já aconteceu e já
          # foi gravada. Job vermelho aqui mandaria e-mail dizendo que a
          # publicação falhou, que é justamente o alarme falso que confunde.
          # 2 = nenhum story no ar (publicação de feed, por exemplo).
          if [ "$codigo" != "0" ]; then
            echo "::warning::não capturei o ponto zero (código $codigo) — o"
            echo "coletor de hora em hora ainda pega este story depois"
            exit 0
          fi

          git add -- state/stories_metrics.csv state/stories_curva.csv
          if git diff --cached --quiet; then
            echo "nada novo para registrar"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: métricas dos stories'
          for tentativa in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((tentativa * 5))
          done
          echo "::warning::não consegui publicar o ponto zero da curva"
          exit 0
