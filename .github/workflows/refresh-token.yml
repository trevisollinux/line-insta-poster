name: Renovar token do Instagram

# O long-lived token dura ~60 dias. Sem isto a automação morre em silêncio e
# ninguém percebe até abrir o perfil. Roda mensal, com folga de ~30 dias.
#
# Exige GH_SECRETS_TOKEN: PAT fine-grained com "Secrets: read and write" neste
# repositório — o GITHUB_TOKEN padrão do Actions não escreve secrets.

on:
  schedule:
    - cron: '0 9 1 * *'    # dia 1, 6h no horário de Brasília
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: pip install --quiet -r requirements.txt

      - name: Validade antes da renovação
        continue-on-error: true
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          IG_ALERT_WEBHOOK: ${{ secrets.IG_ALERT_WEBHOOK }}
        run: python -m poster.cli token --warn-days 15

      - name: Renovar e gravar no secret
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          IG_ALERT_WEBHOOK: ${{ secrets.IG_ALERT_WEBHOOK }}
        run: |
          python -m poster.cli refresh-token \
            --secret-repo "${{ github.repository }}" \
            --secret-name IG_ACCESS_TOKEN
