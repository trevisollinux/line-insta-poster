name: Importar fotos do Drive

# Varre a pasta do Drive onde a curadoria humana larga foto nova, traz o que
# ainda não veio, hospeda no repositório de mídia e põe na fila de stories.
#
# A pasta é caixa de entrada, não host: a Meta nunca busca nada lá.
#
# ATENÇÃO: daqui não sai rascunho para aprovar. O que entra em
# queue/stories.yaml publica sozinho como story, um por execução do cron —
# quem decide é quem sobe a foto na pasta. Feed e Reels (queue/posts.yaml)
# continuam exigindo aprovação humana.

on:
  schedule:
    - cron: '0 12 * * *'   # 9h no horário de Brasília
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: instagram-inbox
  cancel-in-progress: false

env:
  MEDIA_REPO: trevisollinux/line-store-media

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clonar o repositório de mídia
        env:
          GH_MEDIA_TOKEN: ${{ secrets.GH_MEDIA_TOKEN }}
        run: |
          # Secret ausente e token inválido dão o mesmo erro do git ("Invalid
          # username or token"), e a correção de cada um é em lugar diferente.
          if [ -z "${GH_MEDIA_TOKEN}" ]; then
            echo "::error::O secret GH_MEDIA_TOKEN não existe (ou está vazio) em"
            echo "${GITHUB_REPOSITORY}. Ele precisa estar NESTE repositório, o do"
            echo "código — é aqui que o workflow roda. Criar o PAT não basta:"
            echo "Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi
          git clone --depth 1 \
            "https://x-access-token:${GH_MEDIA_TOKEN}@github.com/${MEDIA_REPO}.git" \
            "$RUNNER_TEMP/media"

      - name: Preparar o repositório de mídia
        run: |
          # Duas coisas aqui, e a diferença entre elas importa:
          #
          # 1. Repositório recém-criado não tem commit nenhum, e sem branch o
          #    jsDelivr não serve nada — inicializar é requisito, não contorno.
          # 2. Credencial errada só apareceria na primeira foto de verdade, com
          #    alguém esperando. Melhor descobrir agora.
          cd "$RUNNER_TEMP/media"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git rev-parse HEAD >/dev/null 2>&1; then
            saida=$(git push --dry-run origin HEAD 2>&1) || {
              echo "$saida"
              echo "::error::Não consegui escrever em ${MEDIA_REPO}. Se a mensagem acima"
              echo "fala em permissão ou 403, confira o GH_MEDIA_TOKEN: fine-grained PAT,"
              echo "Only select repositories → ${MEDIA_REPO}, Contents: Read and write."
              exit 1
            }
            echo "acesso de escrita confirmado em ${MEDIA_REPO}"
            exit 0
          fi

          echo "repositório vazio — inicializando"
          mkdir -p inbox
          cat > README.md <<'DOC'
          # line-store-media

          Mídia servida para a publicação no Instagram, usada por
          [line-insta-poster](https://github.com/trevisollinux/line-insta-poster).

          Este repositório é **público por necessidade**: quem baixa os arquivos é o
          servidor da Meta, que não tem credencial nenhuma. Repositório privado
          simplesmente não funcionaria para isso.

          - `inbox/` — fotos e vídeos vindos da pasta do Drive
          - As URLs de publicação usam o jsDelivr, que espelha este repositório e
            serve com o tipo de conteúdo correto (o `raw.githubusercontent.com` não).

          Não edite nada aqui à mão: os arquivos são escritos pelos workflows.
          DOC
          touch inbox/.gitkeep
          git add -A
          git commit -m 'chore: inicializa o repositório de mídia'
          git push -u origin HEAD:main || {
            echo "::error::Não consegui escrever em ${MEDIA_REPO} — confira o"
            echo "GH_MEDIA_TOKEN: Only select repositories → ${MEDIA_REPO},"
            echo "Repository permissions → Contents: Read and write."
            exit 1
          }
          echo "repositório de mídia inicializado e acesso de escrita confirmado"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: pip install --quiet -r requirements.txt

      - name: Importar da pasta
        id: importar
        env:
          GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          IG_ALERT_WEBHOOK: ${{ secrets.IG_ALERT_WEBHOOK }}
        run: |
          set +e
          python -m poster.cli inbox \
            --media-dir "$RUNNER_TEMP/media" \
            --media-repo "$MEDIA_REPO" \
            --report "$RUNNER_TEMP/inbox.md"
          codigo=$?
          echo "codigo=$codigo" >> "$GITHUB_OUTPUT"
          # 2 = pasta sem novidade: é aviso, não falha do job.
          if [ "$codigo" = "2" ]; then exit 0; fi
          exit $codigo

      - name: Publicar a mídia no repositório de mídia
        if: steps.importar.outputs.codigo == '0'
        run: |
          cd "$RUNNER_TEMP/media"
          git add -- inbox/
          if git diff --cached --quiet; then
            echo "nenhuma mídia nova"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: mídia nova vinda do Drive'
          git push

      - name: Commitar a fila de stories
        if: steps.importar.outputs.codigo == '0'
        run: |
          git add -- queue/stories.yaml state/inbox.json
          if git diff --cached --quiet; then
            echo "nenhuma fila nova"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: stories vindos da pasta do Drive'
          git push

      - name: Avisar por e-mail (issue)
        if: always() && steps.importar.outputs.codigo == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s "$RUNNER_TEMP/inbox.md" ]; then
            echo "sem relatório para enviar"
            exit 0
          fi
          gh issue create \
            --title "Fotos novas do Drive — $(date -u +%d/%m/%Y)" \
            --body-file "$RUNNER_TEMP/inbox.md"
