name: Publicar Stories (automático)

# Publica um story por execução da fila que vem do Drive, sem aprovação.
#
# Por que esta fila dispensa a conferência de preço: story não leva legenda (a
# API não aceita), e a flag reviewed_price existe para barrar preço velho na
# legenda. O que ela não cobre — preço queimado dentro da imagem — nenhuma
# validação cobre; story dura 24h e dá para apagar pelo app.
#
# Feed e Reels continuam exigindo aprovação, em queue/posts.yaml.

on:
  schedule:
    # ATENÇÃO: estes horários são de DISPARO, não de publicação.
    #
    # O cron agendado deste repositório atrasa de 3h20 a 5h24 — medido em
    # execuções reais, não estimado. A causa NÃO é fila de runner: comparando
    # created_at com run_started_at, a fila foi 0s em todas. O agendador do
    # GitHub é que acorda pouco e de forma irregular (34 a 352 min entre
    # despertares), e o run só nasce no primeiro despertar depois do horário
    # marcado. Marcar 18h aqui publicava perto das 22h.
    #
    # Por isso os horários estão adiantados ~4h em relação ao alvo:
    #   13h34 BRT  →  story sai entre 16h54 e 18h08
    #   17h34 BRT  →  story sai entre 20h54 e 22h08
    #
    # São Paulo é UTC-3 fixo (sem horário de verão desde 2019), então é só
    # somar 3h — o cron não anda em outubro.
    #
    # O minuto 34 é hipótese, não fato: as quatro execuções que medi estavam
    # todas em minuto 00, o mais disputado da hora, e um minuto quebrado deve
    # cair fora do pico. Pode ajudar, pode não mudar nada — os próximos dias
    # dizem.
    - cron: '34 16 * * *'  # 13h34 em Brasília
    - cron: '34 20 * * *'  # 17h34 em Brasília
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'escolher o item sem publicar'
        type: choice
        options: ['false', 'true']
        default: 'false'

permissions:
  contents: write

jobs:
  publicar:
    uses: ./.github/workflows/publish.yml
    secrets: inherit
    with:
      media_type: STORIES
      queue: queue/stories.yaml
      selection: order
      dry_run: ${{ inputs.dry_run || 'false' }}
