name: Publicar Stories (automático)

# Publica um story por execução da fila que vem do Drive, sem aprovação.
#
# Por que esta fila dispensa a conferência de preço: story não leva legenda (a
# API não aceita), e a flag reviewed_price existe para barrar preço velho na
# legenda. O que ela não cobre — preço queimado dentro da imagem — nenhuma
# validação cobre; story dura 24h e dá para apagar pelo app.
#
# Feed e Reels continuam exigindo aprovação, em queue/posts.yaml.

on:
  schedule:
    # ATENÇÃO: estes horários são de DISPARO, não de publicação.
    #
    # O cron agendado deste repositório atrasa de 3h20 a 4h34 — medido em
    # quatro execuções reais, não estimado. Repositório público roda na fila
    # gratuita compartilhada, que o GitHub despriorizou; o atraso é o preço do
    # "de graça", não defeito nosso. Marcar 18h aqui publicava perto das 22h.
    #
    # Por isso os horários estão adiantados ~4h em relação ao alvo:
    #   13h10 BRT  →  story sai entre 16h30 e 17h44
    #   17h10 BRT  →  story sai entre 20h30 e 21h44
    #
    # São Paulo é UTC-3 fixo (sem horário de verão desde 2019), então é só
    # somar 3h — o cron não anda em outubro.
    #
    # O minuto 10 em vez de 00 é hipótese, não fato: as duas execuções que eu
    # medi estavam ambas em minuto 00, o minuto mais disputado da hora. Pode
    # ajudar, pode não mudar nada — os próximos dias dizem.
    - cron: '10 16 * * *'  # 13h10 em Brasília
    - cron: '10 20 * * *'  # 17h10 em Brasília
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'escolher o item sem publicar'
        type: choice
        options: ['false', 'true']
        default: 'false'

permissions:
  contents: write

jobs:
  publicar:
    uses: ./.github/workflows/publish.yml
    secrets: inherit
    with:
      media_type: STORIES
      queue: queue/stories.yaml
      selection: order
      dry_run: ${{ inputs.dry_run || 'false' }}
