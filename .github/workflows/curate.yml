name: Curadoria do acervo

# Coleta o acervo, ranqueia por desempenho relativo à época e abre um PR com os
# candidatos. O PR existe porque a decisão final é humana: preço conferido e
# modelo ainda em linha. O ranking não sabe nada disso.
#
# Backfill: o acervo inteiro não sai numa execução (rate limit). O cursor fica em
# state/catalog.json e o job continua de onde parou a cada disparo.

on:
  schedule:
    - cron: '0 11 1 * *'   # dia 1, 8h no horário de Brasília
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'lotes de 50 posts por execução'
        default: '10'
      top:
        description: 'quantidade de candidatos no arquivo'
        default: '15'
      since_days:
        description: 'coletar só os últimos N dias (0 = acervo inteiro)'
        default: '0'
      insights:
        description: 'buscar insights (só mídia pós-jul/2024)'
        type: choice
        options: ['false', 'true']
        default: 'false'

permissions:
  contents: write
  issues: write

concurrency:
  group: instagram-curate
  cancel-in-progress: false

jobs:
  curar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: pip install --quiet -r requirements.txt

      - name: Ranquear acervo
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ALERT_WEBHOOK: ${{ secrets.IG_ALERT_WEBHOOK }}
        run: |
          python -m poster.cli curate \
            --max-pages "${{ inputs.max_pages || '10' }}" \
            --top "${{ inputs.top || '15' }}" \
            --rehost \
            --repo "${{ github.repository }}" \
            --branch "${{ github.ref_name }}" \
            --report "$RUNNER_TEMP/curadoria.md" \
            --since-days "${{ inputs.since_days || '0' }}" \
            ${{ (inputs.insights == 'true') && '--insights' || '' }}

      - name: Commitar candidatos e mídia
        run: |
          # Tudo vai para main de propósito. A mídia é insumo, não proposta: se
          # ela ficasse numa branch, os links do relatório apontariam para
          # arquivos que só existem lá. A aprovação acontece na issue e na edição
          # de queue/posts.yaml, não num diff de candidatos.
          git add -- queue/candidates.yaml state/catalog.json media/
          if git diff --cached --quiet; then
            echo "nenhuma mudança no ranking"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'curadoria: atualiza candidatos, catálogo e mídia'
          git push

      - name: Avisar por e-mail (issue)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # O GitHub só manda e-mail de run que falha. Issue em repositório seu
          # gera e-mail e ainda serve de lugar para marcar o que foi aprovado.
          if [ ! -s "$RUNNER_TEMP/curadoria.md" ]; then
            echo "sem relatório para enviar"
            exit 0
          fi
          gh issue create \
            --title "Curadoria: candidatos de $(date -u +%d/%m/%Y)" \
            --body-file "$RUNNER_TEMP/curadoria.md"
