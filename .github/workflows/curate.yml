name: Curadoria do acervo

# Coleta o acervo, ranqueia por desempenho relativo à época e abre um PR com os
# candidatos. O PR existe porque a decisão final é humana: preço conferido e
# modelo ainda em linha. O ranking não sabe nada disso.
#
# Backfill: o acervo inteiro não sai numa execução (rate limit). O cursor fica em
# state/catalog.json e o job continua de onde parou a cada disparo.

on:
  schedule:
    - cron: '0 11 1 * *'   # dia 1, 8h no horário de Brasília
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'lotes de 50 posts por execução'
        default: '10'
      top:
        description: 'quantidade de candidatos no arquivo'
        default: '20'
      since_days:
        description: 'coletar só os últimos N dias (0 = acervo inteiro)'
        default: '0'
      insights:
        description: 'buscar insights (só mídia pós-jul/2024)'
        type: choice
        options: ['false', 'true']
        default: 'false'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: instagram-curate
  cancel-in-progress: false

jobs:
  curar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: pip install --quiet -r requirements.txt

      - name: Ranquear acervo
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ALERT_WEBHOOK: ${{ secrets.IG_ALERT_WEBHOOK }}
        run: |
          python -m poster.cli curate \
            --max-pages "${{ inputs.max_pages || '10' }}" \
            --top "${{ inputs.top || '20' }}" \
            --since-days "${{ inputs.since_days || '0' }}" \
            ${{ (inputs.insights == 'true') && '--insights' || '' }}

      - name: Abrir PR com os candidatos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Preciso do `git add` antes: candidates.yaml e catalog.json nascem
          # nesta execução, e `git diff` sozinho não enxerga arquivo novo — o
          # job sairia verde tendo jogado o resultado fora.
          git add -- queue/candidates.yaml state/catalog.json
          if git diff --cached --quiet; then
            echo "nenhuma mudança no ranking"
            exit 0
          fi
          branch="curadoria/$(date -u +%Y-%m-%d-%H%M)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git commit -m 'curadoria: atualiza candidatos e catálogo'
          git push -u origin "$branch"
          gh pr create \
            --title "Curadoria: candidatos de $(date -u +%d/%m/%Y)" \
            --body-file .github/CURADORIA_PR.md \
            --base main \
            --head "$branch"
