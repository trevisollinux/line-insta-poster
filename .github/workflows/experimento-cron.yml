name: Experimento — cron de madrugada

# TEMPORÁRIO. Apagar depois de ler o resultado.
#
# Pergunta: o atraso de 3h20 a 4h34 que medimos nos crons deste repositório
# cai de madrugada, quando a fila do GitHub deve estar mais vazia?
#
# Todas as medições anteriores foram de crons marcados para 12h e 13h UTC, ou
# seja, horário comercial nos Estados Unidos e na Europa. Se o atraso for
# contenção de carga, a madrugada deve mostrar número bem menor. Se vier igual,
# a hipótese de carga cai e a compensação de ~4h fica valendo para sempre.
#
# Um disparo só, com dia e mês fixos — não é agenda recorrente.
#
# Fica em arquivo separado de propósito: mexer no publicar-stories-auto.yml
# para um teste descartável bagunçaria o teste que fixa os horários dele e o
# vigia, que lê a agenda de lá.

on:
  schedule:
    - cron: '23 2 20 9 *'   # 23h23 de 19/09 em Brasília
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    uses: ./.github/workflows/publish.yml
    secrets: inherit
    with:
      media_type: STORIES
      queue: queue/stories.yaml
      selection: order
      dry_run: 'false'
